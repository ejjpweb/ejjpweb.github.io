<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="350" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Calibration Workflow</text>
  
  <!-- Row 1: Data Sources -->
  <rect x="50" y="60" width="120" height="50" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="110" y="90" text-anchor="middle" font-family="Arial" font-size="11" fill="#e65100">Sensor Data</text>
  
  <rect x="200" y="60" width="120" height="50" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="260" y="90" text-anchor="middle" font-family="Arial" font-size="11" fill="#1565c0">CAMS Data</text>
  
  <!-- Row 2: Calibration Script -->
  <rect x="100" y="150" width="180" height="60" rx="8" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="190" y="175" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#f57f17">build_calibration.py</text>
  <text x="190" y="195" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Monthly update</text>
  
  <!-- Row 2: JSON File -->
  <rect x="320" y="150" width="160" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="400" y="175" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2e7d32">factor_meteo_func.json</text>
  <text x="400" y="195" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Piecewise function</text>
  
  <!-- Row 3: Scripts that use calibration -->
  <rect x="520" y="60" width="130" height="45" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="585" y="88" text-anchor="middle" font-family="Arial" font-size="10" fill="#c2185b">01publisher_*.py</text>
  
  <rect x="520" y="115" width="130" height="45" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="585" y="143" text-anchor="middle" font-family="Arial" font-size="10" fill="#c2185b">02analysis_*.py</text>
  
  <rect x="520" y="170" width="130" height="45" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="585" y="198" text-anchor="middle" font-family="Arial" font-size="10" fill="#c2185b">export_parasol.py</text>
  
  <!-- Row 4: Output -->
  <rect x="520" y="260" width="220" height="60" rx="8" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
  <text x="630" y="285" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#00695c">Calibrated Irradiance</text>
  <text x="630" y="305" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Consistent across all outputs</text>
  
  <!-- Arrows -->
  <line x1="110" y1="110" x2="150" y2="145" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="110" x2="220" y2="145" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="180" x2="315" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="180" x2="515" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="180" x2="515" y2="135" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="180" x2="515" y2="82" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="220" x2="630" y2="255" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Feedback loop -->
  <path d="M 100 210 L 100 280 L 400 280 L 400 215" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="250" y="295" text-anchor="middle" font-family="Arial" font-size="9" fill="#666" font-style="italic">Periodic recalibration</text>
  
  <!-- Legend -->
  <text x="680" y="340" text-anchor="middle" font-family="Arial" font-size="9" fill="#999">All scripts share same calibration functions</text>
</svg>